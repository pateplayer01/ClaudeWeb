name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleClaudeDebug assembleZaiDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeWeb-apk
          path: app/build/outputs/apk/claude/debug/app-claude-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZaiWeb-apk
          path: app/build/outputs/apk/zai/debug/app-zai-debug.apk
