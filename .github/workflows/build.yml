name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleClaudeDebug assembleZaiDebug
      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/claude/debug/app-claude-debug.apk ClaudeWeb.apk
          cp app/build/outputs/apk/zai/debug/app-zai-debug.apk ZaiWeb.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" ClaudeWeb.apk ZaiWeb.apk --title "Build ${{ github.run_number }}" --notes "Automatic build" --latest
